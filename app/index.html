<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05050a">
  <title>Gastos Família Lira</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone.svg">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- Ilustração de gráfico em neon, usada na entrada e no topo -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="neon-verde" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#39ff88" stop-opacity="0.15"/>
        <stop offset="1" stop-color="#39ff88"/>
      </linearGradient>
      <linearGradient id="neon-azul" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#22d3ff" stop-opacity="0.15"/>
        <stop offset="1" stop-color="#22d3ff"/>
      </linearGradient>
      <linearGradient id="neon-rosa" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#ff3ec9" stop-opacity="0.15"/>
        <stop offset="1" stop-color="#ff3ec9"/>
      </linearGradient>
      <linearGradient id="neon-amarelo" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#ffe93b" stop-opacity="0.15"/>
        <stop offset="1" stop-color="#ffe93b"/>
      </linearGradient>
      <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="borrado"/>
        <feMerge><feMergeNode in="borrado"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <symbol id="ilustracao" viewBox="0 0 240 160">
      <g stroke="#ffffff" stroke-opacity="0.07">
        <line x1="10" y1="40" x2="230" y2="40"/>
        <line x1="10" y1="80" x2="230" y2="80"/>
        <line x1="10" y1="120" x2="230" y2="120"/>
      </g>
      <rect x="28" y="96" width="30" height="54" rx="7" fill="url(#neon-azul)"/>
      <rect x="78" y="74" width="30" height="76" rx="7" fill="url(#neon-rosa)"/>
      <rect x="128" y="54" width="30" height="96" rx="7" fill="url(#neon-amarelo)"/>
      <rect x="178" y="28" width="30" height="122" rx="7" fill="url(#neon-verde)"/>
      <path d="M22 110 L74 86 L124 92 L174 50 L214 20" fill="none" stroke="#39ff88" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#brilho)"/>
      <circle cx="214" cy="20" r="7" fill="#39ff88" filter="url(#brilho)"/>
    </symbol>
  </svg>

  <!-- Tela de entrada -->
  <main id="tela-entrada" class="tela">
    <div class="entrada-caixa">
      <svg class="ilustracao-grande" role="img" aria-label="Gráfico subindo"><use href="#ilustracao"/></svg>
      <h1 class="nome-app">Gastos Família Lira</h1>
      <p class="subtitulo">Seus gastos do mês, claros e no controle.</p>
      <form id="form-entrada" novalidate>
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" minlength="6" required>
        <p id="aviso-entrada" class="aviso" role="alert" hidden></p>
        <button type="submit" id="botao-entrar" class="botao-principal">Entrar</button>
        <button type="button" id="botao-criar" class="botao-secundario">Criar conta</button>
      </form>
    </div>
  </main>

  <!-- Tela principal -->
  <main id="tela-principal" class="tela" hidden>
    <header class="topo">
      <div class="marca">
        <svg class="ilustracao-pequena" aria-hidden="true"><use href="#ilustracao"/></svg>
        <h1 class="nome-app">Gastos Família Lira</h1>
      </div>
      <button type="button" id="botao-sair" class="botao-link">Sair</button>
    </header>

    <section class="cartao cartao-total" aria-live="polite">
      <p class="rotulo" id="rotulo-mes">Total do mês</p>
      <p class="total" id="total-mes">R$ 0,00</p>
      <p class="rotulo" id="media-dia">Média de R$ 0,00 por dia</p>
      <svg id="grafico-linha" class="grafico-linha" viewBox="0 0 300 70" preserveAspectRatio="none"
           role="img" aria-label="Gasto acumulado ao longo do mês"></svg>
    </section>

    <p id="aviso-geral" class="aviso" role="alert" hidden></p>

    <section class="cartao">
      <h2>Gastos do mês</h2>
      <ul id="lista-gastos" class="lista"></ul>
      <p id="lista-vazia" class="vazio">Nenhum gasto lançado neste mês.</p>
    </section>

    <section class="cartao">
      <h2>Lançar à mão</h2>
      <form id="form-gasto" novalidate>
        <label for="valor">Valor (R$)</label>
        <input id="valor" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" required>
        <label for="descricao">Onde ou com o quê</label>
        <input id="descricao" type="text" placeholder="Ex.: mercado, cimento, conta de luz" autocomplete="off">
        <p class="rotulo-campo">Categoria</p>
        <div id="botoes-categoria" class="categorias" role="radiogroup" aria-label="Categoria"></div>
        <label for="data">Data</label>
        <input id="data" type="date" required>
        <p id="aviso-gasto" class="aviso" role="alert" hidden></p>
        <button type="submit" id="botao-salvar" class="botao-principal">Salvar</button>
      </form>
    </section>

    <section class="cartao">
      <h2>Por categoria</h2>
      <div class="rosca-area">
        <div class="rosca">
          <svg id="grafico-rosca" viewBox="0 0 120 120" role="img" aria-label="Divisão dos gastos por categoria"></svg>
          <div class="rosca-centro">
            <span class="rosca-rotulo">Total</span>
            <strong id="rosca-total">R$ 0,00</strong>
          </div>
        </div>
        <ul id="legenda" class="legenda"></ul>
      </div>
    </section>

    <section class="cartao" id="cartao-resumo" hidden>
      <h2>Resumo da semana</h2>
      <p id="texto-resumo" class="texto-resumo"></p>
    </section>

    <section class="cartao cartao-assistente">
      <h2>Assistente</h2>
      <form id="form-assistente" novalidate>
        <label for="frase" class="rotulo-campo">Conte o gasto numa frase</label>
        <input id="frase" type="text" placeholder="Ex.: gastei 50 no mercado" autocomplete="off">
        <div class="linha-botoes">
          <button type="submit" class="botao-secundario">Enviar</button>
          <button type="button" id="botao-foto" class="botao-secundario">Foto do cupom</button>
        </div>
        <p id="aviso-assistente" class="aviso aviso-info" role="status" hidden></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="configuracao.js"></script>
  <script src="app.js"></script>
</body>
</html>
